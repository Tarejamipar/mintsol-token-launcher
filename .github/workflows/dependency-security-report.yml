name: Dependency security audit report

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-security-report.yml"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate dependency audit report
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > dependency-audit.json
          audit_status=$?
          set -e
          echo "status=$audit_status" >> "$GITHUB_OUTPUT"
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            try {
              const report = JSON.parse(fs.readFileSync("dependency-audit.json", "utf8"));
              const counts = report.metadata?.vulnerabilities ?? {};
              console.log("Dependency audit summary:");
              console.log(JSON.stringify(counts, null, 2));
              if (report.error) console.log("Audit error: " + report.error.summary);
            } catch (error) {
              console.error("Could not parse npm audit JSON: " + error.message);
              process.exitCode = 1;
            }
          '
          # Keep this step successful so the report is uploaded before the gate runs.
          exit 0

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit-report
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce high-severity audit gate
        if: steps.audit.outputs.status != '0'
        run: |
          echo "npm audit reported high-severity vulnerabilities or an audit error."
          echo "Review the dependency-security-audit-report artifact before changing dependencies."
          exit 1
