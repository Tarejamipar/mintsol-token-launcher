name: Dependency Remediation (Review Only)

on:
  push:
    branches:
      - security/dependency-remediation-workflow
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-remediation-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply non-breaking npm audit fixes
        id: fix
        continue-on-error: true
        run: npm audit fix --no-fund

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Build production bundle
        id: build
        continue-on-error: true
        run: npm run build

      - name: Capture remaining audit findings
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Commit dependency manifest and lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency manifest or lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore: apply non-breaking dependency audit fixes"
          git push origin HEAD:security/dependency-remediation-workflow

      - name: Summarize validation
        if: always()
        run: |
          {
            echo "## Dependency remediation summary"
            echo "- npm audit fix: ${{ steps.fix.outcome }}"
            echo "- Unit tests: ${{ steps.tests.outcome }}"
            echo "- Production build: ${{ steps.build.outcome }}"
            echo "- High-severity audit: ${{ steps.audit.outcome }}"
            echo ""
            echo "Review complete logs and any lockfile commit before merging."
          } >> "$GITHUB_STEP_SUMMARY"
